<form [formGroup]="dataForm">
    <h3>Személyes adatok</h3>
    <div class="name-container">
        <div>
            <label for="firstname">Keresztnév</label>
            <input type="text" name="firstname" id="firstname" formControlName="firstname" [value]="userData==='' ? '' : userData.first_name">
        </div>
        <div>
            <label for="lastname">Vezetéknév</label>
            <input type="text" name="lastname" id="lastname" formControlName="lastname" [value]="userData==='' ? '' : userData.last_name">
        </div>
    </div>
    <h3>Lakcím</h3>
    <div class="address-container">
        <div>
            <label for="postcode">Irányítószám</label>
            <input type="text" name="postcode" id="postcode" formControlName="postcode" [value]="userData==='' ? '' : userData.post_code">

            <label for="street">Utca</label>
            <input type="text" name="street" id="street" formControlName="street" [value]="userData==='' ? '' : userData.street">
        </div>
        <div>
            <label for="city">Város</label>
            <input type="text" name="city" id="city" formControlName="city" [value]="userData==='' ? '' : userData.city">

            <label for="housenum">Házszám</label>
            <input type="text" name="housenum" id="housenum" formControlName="housenum" [value]="userData==='' ? '' : userData.house_number">
        </div>
    </div>
    <button (click)="editCustomerData()">Változtatások elmentése</button>
</form>
